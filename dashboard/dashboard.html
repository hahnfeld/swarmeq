<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>swarmeq · mood telemetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  /* swarmeq · mood telemetry v0
     The wheel is the read. The face is a small honest readout.
     Team strip surfaces aggregate mood at a glance. */
  :root {
    color-scheme: dark;

    --bg:            #0E1116;
    --bg-1:          #141821;
    --bg-2:          #1B2230;
    --bg-3:          #232C3D;

    --line:          rgba(255, 255, 255, 0.06);
    --line-strong:   rgba(255, 255, 255, 0.12);

    --text:          #E8EDF5;
    --text-2:        #B0B9CB;
    --text-3:        #8892A6;
    --text-4:        #5A6478;

    --accent:        #5EE7A1;
    --warn:          #FFB454;
    --alarm:         #FF5C5C;

    /* Six cores — saturated, designed to pop on dark */
    --c-mad:         #FF5C5C;
    --c-sad:         #6BB6FF;
    --c-scared:      #C490FF;
    --c-joyful:      #FFD43A;
    --c-powerful:    #FF9F47;
    --c-peaceful:    #5EE7A1;

    --ease:          cubic-bezier(.22, 1, .36, 1);
    --ease-soft:     cubic-bezier(.37, .01, .42, 1);

    --display:       'Geist', system-ui, sans-serif;
    --mono:          'Geist Mono', ui-monospace, monospace;
    --serif:         'Instrument Serif', Georgia, serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--display);
    color: var(--text);
    background:
      radial-gradient(ellipse 80% 50% at 50% -8%, rgba(94, 231, 161, 0.04), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
  }
  ::selection { background: rgba(94, 231, 161, 0.20); }

  /* ─── Top chrome ─────────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 20px;
    padding: 18px 32px;
    border-bottom: 1px solid var(--line);
    background: rgba(14, 17, 22, 0.7);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 10;
  }
  .brand {
    display: inline-flex; align-items: baseline; gap: 0;
    flex: 0 0 auto;
    text-decoration: none;
    font-family: var(--display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.025em;
    line-height: 1;
  }
  .brand .swarm { color: var(--text); }
  .brand .eq    { color: #4FB8C6; }
  .topbar .crumb {
    font-family: var(--mono); font-size: 11px;
    color: var(--text-3); letter-spacing: 0.01em;
  }
  .topbar .crumb b { color: var(--text-2); font-weight: 500; }
  .topbar .view-toggle {
    margin-left: auto;
    display: inline-flex; align-items: stretch;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 2px;
    background: rgba(255, 255, 255, 0.015);
  }
  .topbar .view-toggle button {
    appearance: none;
    border: none; background: transparent;
    padding: 5px 14px;
    border-radius: 999px;
    font-family: var(--mono); font-size: 10.5px;
    color: var(--text-3); cursor: pointer;
    text-transform: lowercase; letter-spacing: 0.06em;
    transition: background 220ms ease, color 220ms ease;
  }
  .topbar .view-toggle button:hover { color: var(--text); }
  .topbar .view-toggle button[aria-pressed="true"] {
    background: var(--bg-2);
    color: var(--text);
  }
  .topbar .live {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    background: rgba(94, 231, 161, 0.08);
    border: 1px solid rgba(94, 231, 161, 0.20);
    font-family: var(--mono); font-size: 10px;
    color: var(--accent); letter-spacing: 0.08em;
    text-transform: lowercase;
  }
  .topbar .live .pip {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent);
    animation: heartbeat 2.6s var(--ease) infinite;
  }
  @keyframes heartbeat {
    0%, 70%, 100% { box-shadow: 0 0 0 0 rgba(94, 231, 161, 0); }
    12%           { box-shadow: 0 0 0 4px rgba(94, 231, 161, 0.20); }
    24%           { box-shadow: 0 0 0 7px rgba(94, 231, 161, 0); }
    30%           { box-shadow: 0 0 0 0 rgba(94, 231, 161, 0.15); }
    42%           { box-shadow: 0 0 0 3px rgba(94, 231, 161, 0.10); }
  }
  .topbar .live.err {
    background: rgba(255, 92, 92, 0.08);
    border-color: rgba(255, 92, 92, 0.22);
    color: var(--alarm);
  }
  .topbar .live.err .pip { background: var(--alarm); animation: none; opacity: 0.5; }
  .topbar .live.err.actionable { cursor: pointer; }
  .topbar .live.err.actionable:hover {
    background: rgba(255, 92, 92, 0.14);
    border-color: rgba(255, 92, 92, 0.35);
  }

  /* ─── Team strip — all agents at a glance ────────────────────── */
  .team {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 8px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--line);
  }
  .team[hidden] { display: none; }
  .agent {
    --tone: var(--text-3);
    appearance: none;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 14px 8px 12px;
    border-radius: 12px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    font-family: var(--display);
    font-size: inherit; color: inherit; text-align: left;
    cursor: pointer; min-width: 0; width: 100%;
    transition: background 220ms var(--ease), border-color 220ms ease, transform 220ms var(--ease);
  }
  .agent:hover { background: var(--bg-2); border-color: var(--line-strong); }
  .agent:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .agent.selected {
    background: var(--bg-2);
    border-color: var(--tone);
    box-shadow:
      0 0 0 1px var(--tone) inset,
      0 12px 24px -8px color-mix(in oklab, var(--tone) 35%, transparent);
  }
  .agent .glyph {
    width: 36px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: color-mix(in oklab, var(--tone) 18%, var(--bg-2));
    user-select: none;
    flex: 0 0 auto;
    overflow: hidden;
    box-shadow: 0 0 12px -2px color-mix(in oklab, var(--tone) 40%, transparent);
  }
  .agent .glyph svg.face-glyph {
    width: 100%; height: 100%;
    display: block;
  }
  .agent .name {
    font-size: 13px; font-weight: 500;
    color: var(--text); letter-spacing: -0.005em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }
  .agent .feeling {
    font-size: 11.5px; font-weight: 400;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0; flex: 0 1 auto;
  }
  .agent .meter { flex: 0 0 auto; margin-left: auto; }
  .agent .pct { flex: 0 0 auto; }
  .agent .meter {
    width: 64px; height: 4px;
    align-self: center;
    overflow: visible;
    position: relative;
  }
  .agent .meter::before {
    /* Faint track — barely there, just enough to anchor the empty space. */
    content: ""; position: absolute; inset: 0;
    background: var(--line);
    border-radius: 2px;
  }
  .agent .meter .fill {
    position: absolute; left: 0; top: 0; height: 100%;
    background: var(--tone);
    border-radius: 2px;
    box-shadow: 0 0 8px 0 color-mix(in oklab, var(--tone) 60%, transparent);
    transition: width 600ms var(--ease);
  }
  .agent .pct {
    font-family: var(--mono); font-size: 10.5px;
    color: var(--text-3); letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    margin-left: -2px;
  }
  .agent.selected .pct { color: var(--text-2); }
  .agent.struggling::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--alarm); margin-right: -2px;
    box-shadow: 0 0 8px var(--alarm);
  }

  /* ─── Empty state ────────────────────────────────────────────── */
  .empty {
    padding: 96px 32px; max-width: 580px;
  }
  .empty[hidden] { display: none; }
  .empty h2 {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: clamp(40px, 5vw, 64px);
    line-height: 1.0; letter-spacing: -0.02em;
    margin: 0 0 24px; color: var(--text);
  }
  .empty h2 em { font-style: normal; font-family: var(--display); color: var(--text-2); font-weight: 300; }
  .empty p {
    font-family: var(--display); font-weight: 300;
    font-size: 16px; line-height: 1.5;
    color: var(--text-2); max-width: 44ch; margin: 0;
  }
  .empty code {
    font-family: var(--mono); font-size: 12.5px;
    color: var(--text);
    background: var(--bg-1); border: 1px solid var(--line);
    padding: 1px 7px; border-radius: 5px;
  }


  /* ─── Portrait stage (the shot) ──────────────────────────────── */
  .stage {
    padding: 32px 32px 64px;
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr);
    gap: 56px;
    align-items: center;
    max-width: 1440px; margin: 0 auto;
  }
  .stage[hidden] { display: none; }

  /* ─── Wheel (the hero) ───────────────────────────────────────── */
  .wheel-bay {
    aspect-ratio: 1;
    max-width: 620px;
    width: 100%;
    margin: 0 auto;
    position: relative;
  }
  svg.wheel {
    width: 100%; height: 100%;
    display: block;
    overflow: visible;
  }
  /* Face glyph at wheel center — sits in the empty inner ring, no chrome,
     with a soft drop-shadow glow tinted to the dominant feeling's color.
     drop-shadow follows the face silhouette so the glow can't bleed onto the wheel. */
  .wheel-emoji {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 20%; height: 16%;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    user-select: none;
    overflow: visible;
  }
  .wheel-emoji svg.face-glyph {
    width: 100%; height: 100%;
    display: block;
    filter:
      drop-shadow(0 0 4px color-mix(in oklab, var(--feelings-color, white) 80%, transparent))
      drop-shadow(0 0 10px color-mix(in oklab, var(--feelings-color, white) 50%, transparent));
    animation: face-breathe 5s var(--ease-soft) infinite;
    transition: filter 720ms ease;
  }
  @keyframes face-breathe {
    0%, 100% { transform: scale(0.97); opacity: 0.92; }
    50%      { transform: scale(1.04); opacity: 1.00; }
  }
  .wheel-scale {
    transform-origin: 0 0;
    transform-box: view-box;
    animation: breathe 11s var(--ease-soft) infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1.000); }
    50%      { transform: scale(1.008); }
  }
  svg.wheel path.arc {
    stroke: var(--bg);
    stroke-width: 1;
    fill-opacity: 0.10;
    transition: fill-opacity 480ms var(--ease), filter 480ms ease;
  }
  svg.wheel path.arc.lit {
    fill-opacity: 0.95;
    filter: url(#softGlow);
  }
  svg.wheel text.lbl {
    fill: var(--text-3); font-size: 8px; font-weight: 500;
    pointer-events: none; text-anchor: middle; dominant-baseline: middle;
    font-family: var(--display);
    letter-spacing: 0;
    transition: fill 360ms ease, font-weight 360ms ease;
  }
  svg.wheel text.lbl.lit { fill: var(--text); font-weight: 600; }
  svg.wheel text.lbl.core {
    fill: rgba(255, 255, 255, 0.92);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: lowercase;
  }
  svg.wheel .hub-bg { fill: var(--bg-1); }
  svg.wheel .hub-ring { fill: none; stroke: var(--line); stroke-width: 1; }

  /* ─── Right column: typography readout ───────────────────────── */
  .readout {
    display: flex; flex-direction: column; gap: 20px;
    min-width: 0;
  }
  .readout .crumb {
    font-family: var(--mono); font-size: 10px;
    color: var(--text-4); letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 0;
  }
  .feeling-name {
    margin: 0;
    font-family: var(--display); font-weight: 600;
    font-size: clamp(56px, 7vw, 104px);
    line-height: 0.9;
    letter-spacing: -0.05em;
    text-transform: lowercase;
    color: var(--feelings-color, var(--text));
    transition: color 720ms ease;
    word-break: break-word;
  }
  .feeling-intensity {
    display: inline-flex; align-items: baseline; gap: 8px;
    font-family: var(--mono); font-size: 13px;
    color: var(--text-2); letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }
  .feeling-intensity .pct { color: var(--feelings-color, var(--text)); font-size: 22px; font-weight: 500; transition: color 720ms ease; }
  .feeling-intensity .bar {
    position: relative;
    width: 140px; height: 5px;
  }
  .feeling-intensity .bar::before {
    /* Faint baseline rule */
    content: ""; position: absolute; inset: 0;
    background: var(--line);
    border-radius: 3px;
  }
  .feeling-intensity .bar .fill {
    position: absolute; left: 0; top: 0; height: 100%;
    background: var(--feelings-color, var(--text-3));
    border-radius: 3px;
    box-shadow: 0 0 12px 0 color-mix(in oklab, var(--feelings-color, white) 50%, transparent);
    transition: width 720ms var(--ease), background 720ms ease;
  }
  .also-line {
    font-family: var(--display); font-weight: 400;
    font-size: 15px; color: var(--text-2);
    margin: 0;
  }
  .also-line .lab {
    color: var(--text);
    font-weight: 500;
  }
  .also-line .sep { color: var(--text-4); margin: 0 4px; }
  .also-line .pre { color: var(--text-3); margin-right: 6px; }

  .note {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: 22px; line-height: 1.35;
    color: var(--text); max-width: 32ch;
    margin: 8px 0 0;
    text-wrap: balance;
  }
  .note::before { content: "\201C"; color: var(--feelings-color, var(--text-3)); margin-right: 0.04em; transition: color 720ms ease; }
  .note::after  { content: "\201D"; color: var(--feelings-color, var(--text-3)); margin-left: 0.04em; transition: color 720ms ease; }
  .note.empty {
    font-family: var(--mono); font-style: normal;
    font-size: 11px; letter-spacing: 0.12em;
    color: var(--text-4); text-transform: lowercase;
  }
  .note.empty::before, .note.empty::after { content: none; }

  /* ─── Last-updated line ──────────────────────────────────────── */
  .meta {
    margin-top: 18px;
    display: flex; align-items: baseline; gap: 8px;
    font-family: var(--mono); font-size: 10.5px;
    color: var(--text-4); letter-spacing: 0.06em;
    text-transform: lowercase;
  }
  .meta .lab { color: var(--text-4); }
  .meta .age {
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .agent.stale { opacity: 0.55; }
  .agent.stale::after {
    content: "stale"; margin-left: auto;
    font-family: var(--mono); font-size: 9.5px;
    color: var(--alarm); letter-spacing: 0.08em;
    text-transform: lowercase;
  }
  .agent.stale .meter, .agent.stale .pct { display: none; }

  /* ─── Team stage ─────────────────────────────────────────────── */
  .team-stage {
    padding: 32px 32px 64px;
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr);
    gap: 56px;
    align-items: center;
    max-width: 1440px; margin: 0 auto;
  }
  .team-stage[hidden] { display: none; }

  .sentiment {
    --tone: var(--accent);
    display: flex; flex-direction: column; gap: 18px;
    min-width: 0;
  }
  .sentiment .crumb {
    font-family: var(--mono); font-size: 10px;
    color: var(--text-4); letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 0;
  }
  .sentiment .pct {
    margin: 0;
    font-family: var(--display); font-weight: 600;
    font-size: clamp(72px, 9vw, 128px);
    line-height: 0.9;
    letter-spacing: -0.05em;
    color: var(--tone);
    transition: color 720ms ease;
    font-variant-numeric: tabular-nums;
  }
  .sentiment .pct .sym {
    font-size: 0.45em; font-weight: 500; color: var(--text-3);
    margin-left: 6px; letter-spacing: 0;
  }
  .sentiment .caption {
    font-family: var(--display); font-weight: 400;
    font-size: 14px; color: var(--text-2);
    margin: 0;
  }
  .sentiment .caption .lab { color: var(--tone); font-weight: 500; transition: color 720ms ease; }
  .sentiment .caption .sep { color: var(--text-4); margin: 0 6px; }

  /* ─── Sentiment chart ────────────────────────────────────────── */
  .chart-bay {
    width: 100%;
    margin-top: 6px;
    position: relative;
  }
  .chart-bay svg {
    width: 100%; height: 160px;
    display: block;
    overflow: visible;
  }
  .chart-bay .grid-line {
    stroke: var(--line);
    stroke-width: 1;
    fill: none;
  }
  .chart-bay .mid-line {
    stroke: var(--text-4);
    stroke-width: 1;
    stroke-dasharray: 2 4;
    fill: none;
    opacity: 0.5;
  }
  .chart-bay .axis-lbl {
    font-family: var(--mono); font-size: 9.5px;
    fill: var(--text-4); letter-spacing: 0.08em;
  }
  .chart-bay .area-pos { fill: var(--c-peaceful); fill-opacity: 0.10; }
  .chart-bay .area-neg { fill: var(--c-sad); fill-opacity: 0.10; }
  .chart-bay .trace {
    stroke: var(--tone, var(--text-2));
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    fill: none;
    transition: stroke 720ms ease;
  }
  .chart-bay .dot {
    fill: var(--tone, var(--text-2));
    transition: fill 720ms ease;
  }
  .chart-bay .empty-label {
    font-family: var(--mono); font-size: 11px;
    fill: var(--text-4); letter-spacing: 0.10em;
    text-anchor: middle;
  }

  .team-actions {
    margin-top: 18px;
    display: flex; align-items: center; gap: 12px;
  }

  /* ─── Responsive ─────────────────────────────────────────────── */
  @media (max-width: 980px) {
    .topbar, .team, .stage, .team-stage, .empty { padding-left: 18px; padding-right: 18px; }
    .stage, .team-stage { grid-template-columns: 1fr; gap: 32px; }
    .wheel-bay { max-width: 480px; }
  }
</style>
</head>
<body>
  <!-- Robot face glyph defs — shared by every <svg class="face"> on the page.
       Each face = #bot + eyes + brows + mouth (+ optional accessory), all centered. -->
  <svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <g id="bot">
        <line x1="-45" y1="-5" x2="-35" y2="-5" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-45" cy="-5" r="3" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="35" y1="-5" x2="45" y2="-5" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
        <circle cx="45" cy="-5" r="3" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
        <rect x="-35" y="-30" width="70" height="60" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
        <path d="M-35 -18 v48 a12 12 0 0 0 12 12 h46 a12 12 0 0 0 12 -12 v-48 a12 12 0 0 1 -12 12 h-46 a12 12 0 0 1 -12 -12 Z" fill="#000000" opacity="0.05"/>
        <rect x="-26" y="-18" width="52" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <path d="M-26 -12 v28 a6 6 0 0 0 6 6 h40 a6 6 0 0 0 6 -6 v-28 a6 6 0 0 1 -6 6 h-40 a6 6 0 0 1 -6 -6 Z" fill="#000000" opacity="0.03"/>
      </g>
      <g id="e-o"><circle cx="-12" cy="-4" r="4" fill="#0f172a"/><circle cx="12" cy="-4" r="4" fill="#0f172a"/></g>
      <g id="e-dot"><circle cx="-12" cy="-4" r="2.5" fill="#0f172a"/><circle cx="12" cy="-4" r="2.5" fill="#0f172a"/></g>
      <g id="e-w"><circle cx="-12" cy="-4" r="5" fill="#0f172a"/><circle cx="-13" cy="-5" r="1.5" fill="#fff"/><circle cx="12" cy="-4" r="5" fill="#0f172a"/><circle cx="11" cy="-5" r="1.5" fill="#fff"/></g>

// Render a feeling as an inline <svg> showing the matching robot face.
// label: lowercase feeling name. Returns SVG markup string.
function faceSvg(label) {
  const parts = FACES[label] || FACES["sad"];
  return `<svg viewBox="-50 -40 100 80" class="face-glyph" aria-hidden="true"><use href="#bot"/>${parts.join("")}</svg>`;
}

const store = {
  feelings: null,
  agents: {},
  registry: {},
  active: null,
  stale: new Set(),
  arcByLabel: new Map(),
  teamArcByLabel: new Map(),
  sentiment: { ratio: null, agentCount: 0 },
  history: [], // [{ts, ratio, agentCount}], oldest first
  view: "agent",
};
const $ = id => document.getElementById(id);
const getCSS = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// Prefer the human-readable display_name written by SessionStart (0.6.0+);
// fall back to the registry slug for older entries / hot-upgrade racing.
const displayNameFor = slug => (store.registry?.[slug]?.display_name) || slug;

async function init() {
  const fres = await fetch("/feelings.json");
  store.feelings = await fres.json();
  patchColors();
  buildWheel();
  buildTeamWheel();
  await refreshState();
  await loadHistory();
  connectSSE();
  $("view-agent").addEventListener("click", () => setView("agent", true));
  $("view-team").addEventListener("click", () => setView("team", true));
  window.addEventListener("popstate", () => setView(viewFromPath(), false));
  setView(viewFromPath(), false);
  // Keep the "Xs ago" label honest without re-rendering the whole portrait.
  setInterval(tickAge, 1000);
}

function viewFromPath() {
  return location.pathname === "/team" ? "team" : "agent";
}

function setView(view, push) {
  store.view = view;
  $("view-agent").setAttribute("aria-pressed", view === "agent" ? "true" : "false");
  $("view-team").setAttribute("aria-pressed", view === "team" ? "true" : "false");
  if (push) {
    const path = view === "team" ? "/team" : "/";
    if (location.pathname !== path) history.pushState({}, "", path);
  }
  // Hide whichever stage isn't current. updateChrome() decides between empty
  // vs stage based on agent count, but only applies to the current view.
  applyViewVisibility();
  if (view === "team") {
    renderTeamWheel();
    renderSentimentReadout();
    renderSentimentChart();
  } else if (store.active) {
    renderActive();
  }
}

function applyViewVisibility() {
  const n = Object.keys(store.agents).length;
  const isTeam = store.view === "team";
  $("stage").hidden     = isTeam || !n;
  $("team-stage").hidden = !isTeam || !n;
  $("empty").hidden = !!n;
  // The team strip is a row of individual-agent tabs — hide it when the
  // team view is selected so the team page reads as team-level only.
  $("team").hidden = !n || isTeam;
}

function patchColors() {
  const map = {
    mad: getCSS("--c-mad"),
    sad: getCSS("--c-sad"),
    scared: getCSS("--c-scared"),
    joyful: getCSS("--c-joyful"),
    powerful: getCSS("--c-powerful"),
    peaceful: getCSS("--c-peaceful"),
  };
  for (const c of store.feelings.cores) if (map[c.label]) c.color = map[c.label];
}

async function refreshState() {
  try {
    const r = await fetch("/state");
    const d = await r.json();
    store.agents = d.agents || {};
    store.registry = d.registry || {};
    if (d.sentiment) store.sentiment = d.sentiment;
    // If the currently-selected agent went away, fall back to the first one.
    if (store.active && !store.agents[store.active]) {
      store.active = Object.keys(store.agents)[0] || null;
    }
    renderTeam();
    if (!store.active && Object.keys(store.agents).length) {
      setActive(Object.keys(store.agents)[0]);
    } else if (store.active) {
      renderActive();
    }
    updateChrome();
  } catch (err) {
    setLive("err", "offline");
  }
}

async function loadHistory() {
  try {
    const r = await fetch("/history?limit=500");
    const d = await r.json();
    store.history = Array.isArray(d.points) ? d.points : [];
  } catch {
    store.history = [];
  }
}

function connectSSE() {
  const es = new EventSource("/events");
  es.addEventListener("open",  () => setLive("",    "live"));
  // Native EventSource keeps retrying behind the scenes. We surface a
  // "click to retry" affordance only after the disconnect has persisted
  // long enough that the user might want to force a reload instead of
  // waiting for backoff.
  es.addEventListener("error", () => setLive("err", "reconnecting"));
  es.addEventListener("report", e => {
    const r = JSON.parse(e.data);
    store.agents[r.agent] = r;
    store.stale.delete(r.agent);
    renderTeam();
    if (!store.active) setActive(r.agent);
    else if (store.active === r.agent) renderActive();
    if (store.view === "team") renderTeamWheel();
    updateChrome();
  });
  es.addEventListener("probe-failed", e => {
    const d = JSON.parse(e.data);
    store.stale.add(d.agent);
    renderTeam();
  });
  es.addEventListener("agent-removed", e => {
    const d = JSON.parse(e.data);
    if (!store.agents[d.agent]) return;
    delete store.agents[d.agent];
    store.stale.delete(d.agent);
    if (store.active === d.agent) {
      store.active = Object.keys(store.agents)[0] || null;
    }
    renderTeam();
    if (store.active) renderActive();
    if (store.view === "team") renderTeamWheel();
    updateChrome();
  });
  es.addEventListener("sentiment", e => {
    const p = JSON.parse(e.data);
    store.sentiment = { ratio: p.ratio, agentCount: p.agentCount };
    store.history.push(p);
    if (store.history.length > 500) store.history.shift();
    if (store.view === "team") {
      renderSentimentReadout();
      renderSentimentChart();
    }
  });
}

let _staleTimer = null;
function setLive(cls, txt) {
  const el = $("live");
  // Native EventSource fires `error` on every failed reconnect attempt
  // (~3s cadence). Capture err/actionable state BEFORE we overwrite
  // className so we can preserve the actionable affordance once the
  // 5s timer has fired, and so we don't reset that timer on every
  // retry-error.
  const wasErr = el.classList.contains("err");
  const wasActionable = el.classList.contains("actionable");
  el.className = "live " + cls;

  if (cls === "err") {
    if (wasActionable) {
      // Keep the affordance visible; don't clobber its label.
      el.classList.add("actionable");
    } else {
      el.lastChild.textContent = " " + txt;
    }
    if (!wasErr) {
      // First entry into err state — arm the 5s "click to retry" timer.
      if (_staleTimer) clearTimeout(_staleTimer);
      _staleTimer = setTimeout(() => {
        el.classList.add("actionable");
        el.lastChild.textContent = " reconnecting — click to retry";
        el.title = "click to reload the dashboard";
        el.onclick = () => location.reload();
      }, 5000);
    }
  } else {
    el.lastChild.textContent = " " + txt;
    if (_staleTimer) { clearTimeout(_staleTimer); _staleTimer = null; }
    el.removeAttribute("title");
    el.onclick = null;
  }
}

function updateChrome() {
  const n = Object.keys(store.agents).length;
  const struggling = countStruggling();
  let crumb = `${n} agent${n === 1 ? "" : "s"} reporting`;
  if (struggling > 0) crumb += ` · ${struggling} struggling`;
  const crumbEl = $("crumb");
  crumbEl.replaceChildren();
  const b = document.createElement("b"); b.textContent = crumb;
  crumbEl.appendChild(b);
  applyViewVisibility();
}

// "struggling" = ANY reported feeling rolls up to a mad/scared/sad core with
// intensity >= 0.6. Scanning the full feelings list (not just the dominant
// one) catches cases like "thoughtful 0.7 + skeptical 0.6" where the agent's
// primary signal is positive but a strong negative undercurrent is present
// — the kind of state worth surfacing on the team view.
const STRUGGLING_CORES = new Set(["mad", "scared", "sad"]);
function isStrugglingReport(r) {
  if (!r || !Array.isArray(r.feelings)) return false;
  for (const f of r.feelings) {
    if (!(f && f.intensity >= 0.6)) continue;
    const core = coreForLabel(f.label);
    if (core && STRUGGLING_CORES.has(core.label)) return true;
  }
  return false;
}
function countStruggling() {
  let n = 0;
  for (const r of Object.values(store.agents)) if (isStrugglingReport(r)) n++;
  return n;
}

function renderTeam() {
  const team = $("team");
  team.replaceChildren();
  const names = Object.keys(store.agents).sort();
  for (const name of names) {
    const r = store.agents[name];
    const dom = r.feelings[0];
    const core = dom ? coreForLabel(dom.label) : null;
    const tone = core ? core.color : getCSS("--text-3");
    const intensity = dom ? Math.round(dom.intensity * 100) : 0;
    const isStruggling = isStrugglingReport(r);
    const a = document.createElement("button");
    a.type = "button";
    a.className = "agent"
      + (name === store.active ? " selected" : "")
      + (store.stale.has(name) ? " stale" : "")
      + (isStruggling ? " struggling" : "");
    a.style.setProperty("--tone", tone);
    a.setAttribute("aria-pressed", name === store.active ? "true" : "false");
    const label = displayNameFor(name);
    a.setAttribute("aria-label",
      `${label}, ${dom ? dom.label.toLowerCase() : "no report"}${dom ? `, ${intensity}%` : ""}${isStruggling ? ", struggling" : ""}`);

    const glyph = document.createElement("span"); glyph.className = "glyph"; glyph.innerHTML = faceSvg(dom ? dom.label.toLowerCase() : "peaceful");
    const nameEl = document.createElement("span"); nameEl.className = "name"; nameEl.textContent = label;
    const feelingEl = document.createElement("span"); feelingEl.className = "feeling"; feelingEl.textContent = dom ? dom.label.toLowerCase() : "—";
    const meter = document.createElement("span"); meter.className = "meter";
    const fill = document.createElement("span"); fill.className = "fill"; fill.style.width = `${intensity}%`;
    meter.appendChild(fill);
    const pct = document.createElement("span"); pct.className = "pct"; pct.textContent = `${intensity}%`;

    a.append(glyph, nameEl, feelingEl, meter, pct);
    a.addEventListener("click", () => setActive(name));
    team.appendChild(a);
  }
}

function setActive(name) {
  store.active = name;
  renderTeam();
  renderActive();
}

function renderActive() {
  const r = store.agents[store.active];
  if (!r) return;

  const dom  = r.feelings[0];
  const core = dom ? coreForLabel(dom.label) : null;
  if (core) {
    document.documentElement.style.setProperty("--feelings-color", core.color);
  }

  // Wheel highlights
  for (const [, el] of store.arcByLabel) {
    el.setAttribute("fill-opacity", 0.08);
    el.classList.remove("lit");
    const lbl = el.nextElementSibling;
    if (lbl && lbl.classList.contains("lbl")) lbl.classList.remove("lit");
  }
  for (const f of r.feelings) {
    const el = store.arcByLabel.get(f.label);
    if (!el) continue;
    el.setAttribute("fill-opacity", 0.55 + 0.45 * f.intensity);
    el.classList.add("lit");
    const lbl = el.nextElementSibling;
    if (lbl && lbl.classList.contains("lbl")) lbl.classList.add("lit");
  }

  // Right column
  $("portrait-name").textContent = displayNameFor(store.active);
  $("feeling-name").textContent = dom ? dom.label.toLowerCase() : "—";
  $("feeling-pct").textContent = dom ? `${(dom.intensity * 100).toFixed(0)}%` : "—";
  $("feeling-fill").style.width = dom ? `${dom.intensity * 100}%` : "0%";

  const al = $("also-line");
  al.replaceChildren();
  const rest = r.feelings.slice(1);
  const pre = document.createElement("span"); pre.className = "pre"; pre.textContent = "also";
  al.appendChild(pre);
  if (rest.length === 0) {
    const dash = document.createElement("span"); dash.style.color = "var(--text-4)"; dash.textContent = "—";
    al.appendChild(dash);
  } else {
    rest.forEach((f, i) => {
      if (i > 0) {
        const sep = document.createElement("span"); sep.className = "sep"; sep.textContent = "·";
        al.appendChild(sep);
      }
      const lab = document.createElement("span"); lab.className = "lab"; lab.textContent = f.label.toLowerCase();
      const sep2 = document.createElement("span"); sep2.className = "sep"; sep2.textContent = "·";
      const pct = document.createTextNode(`${(f.intensity * 100).toFixed(0)}%`);
      al.append(lab, sep2, pct);
    });
  }

  const note = $("note");
  if (r.note) { note.textContent = r.note; note.className = "note"; }
  else { note.textContent = "no note this round"; note.className = "note empty"; }

  // Wheel-center emoji
  $("wheel-emoji").innerHTML = faceSvg(dom ? dom.label.toLowerCase() : "peaceful");

  $("m-age").textContent = ageLabel(r.ts);
}

function arcPath(innerR, outerR, a0, a1) {
  const xo0 = Math.cos(a0) * outerR, yo0 = Math.sin(a0) * outerR;
  const xo1 = Math.cos(a1) * outerR, yo1 = Math.sin(a1) * outerR;
  const xi1 = Math.cos(a1) * innerR, yi1 = Math.sin(a1) * innerR;
  const xi0 = Math.cos(a0) * innerR, yi0 = Math.sin(a0) * innerR;
  const large = (a1 - a0) > Math.PI ? 1 : 0;
  return `M ${xo0} ${yo0} A ${outerR} ${outerR} 0 ${large} 1 ${xo1} ${yo1} L ${xi1} ${yi1} A ${innerR} ${innerR} 0 ${large} 0 ${xi0} ${yi0} Z`;
}
function centroid(innerR, outerR, a0, a1) {
  const r = (innerR + outerR) / 2;
  const a = (a0 + a1) / 2;
  return [Math.cos(a) * r, Math.sin(a) * r];
}

function buildWheel() {
  const arcs = $("arcs");
  arcs.innerHTML = "";
  const cores = store.feelings.cores;
  const coreSpan = (Math.PI * 2) / cores.length;
  for (let ci = 0; ci < cores.length; ci++) {
    const c = cores[ci];
    const subs = c.subs || [];
    const inner = subs.slice(0, 6);   // first 6 → middle ring (secondaries)
    const outer = subs.slice(6, 12);  // last 6  → outer ring  (tertiaries)
    const a0 = -Math.PI / 2 + ci * coreSpan;
    const a1 = a0 + coreSpan;
    // Inner core slice
    arcs.appendChild(mkArc(c.color, CORE_R[0], CORE_R[1], a0, a1, c.label));
    arcs.appendChild(mkLabel(c.label, CORE_R[0], CORE_R[1], a0, a1, "lbl core", true));
    // Middle ring: 6 inner secondaries
    const secSpan = coreSpan / Math.max(inner.length, 1);
    for (let i = 0; i < inner.length; i++) {
      const sa0 = a0 + i * secSpan;
      const sa1 = sa0 + secSpan;
      arcs.appendChild(mkArc(c.color, SEC_R[0], SEC_R[1], sa0, sa1, inner[i]));
      arcs.appendChild(mkLabel(inner[i], SEC_R[0], SEC_R[1], sa0, sa1, "lbl"));
    }
    // Outer ring: 6 tertiaries (still equal width across the core's span)
    const tertSpan = coreSpan / Math.max(outer.length, 1);
    for (let i = 0; i < outer.length; i++) {
      const ta0 = a0 + i * tertSpan;
      const ta1 = ta0 + tertSpan;
      arcs.appendChild(mkArc(c.color, TER_R[0], TER_R[1], ta0, ta1, outer[i]));
      arcs.appendChild(mkLabel(outer[i], TER_R[0], TER_R[1], ta0, ta1, "lbl"));
    }
  }
}
function mkArc(color, ir, or_, a0, a1, label, arcMap = store.arcByLabel) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", arcPath(ir, or_, a0, a1));
  p.setAttribute("fill", color);
  p.setAttribute("fill-opacity", "0.08");
  p.setAttribute("class", "arc");
  p.setAttribute("data-label", label);
  const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
  t.textContent = label;
  p.appendChild(t);
  arcMap.set(label, p);
  return p;
}
function mkLabel(text, ir, or_, a0, a1, cls, isCore = false) {
  const [x, y] = centroid(ir, or_, a0, a1);
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("x", x);
  t.setAttribute("y", y);
  t.setAttribute("class", cls);
  if (!isCore) {
    const ang = ((a0 + a1) / 2) * 180 / Math.PI;
    let rot = ang;
    if (rot > 90 || rot < -90) rot += 180;
    t.setAttribute("transform", `rotate(${rot} ${x} ${y})`);
    t.textContent = text.length > 14 ? text.slice(0, 13) + "…" : text;
  } else {
    t.textContent = text;
  }
  return t;
}

function buildTeamWheel() {
  const arcs = $("team-arcs");
  arcs.innerHTML = "";
  store.teamArcByLabel.clear();
  const cores = store.feelings.cores;
  const coreSpan = (Math.PI * 2) / cores.length;
  for (let ci = 0; ci < cores.length; ci++) {
    const c = cores[ci];
    const subs = c.subs || [];
    const inner = subs.slice(0, 6);
    const outer = subs.slice(6, 12);
    const a0 = -Math.PI / 2 + ci * coreSpan;
    const a1 = a0 + coreSpan;
    arcs.appendChild(mkArc(c.color, CORE_R[0], CORE_R[1], a0, a1, c.label, store.teamArcByLabel));
    arcs.appendChild(mkLabel(c.label, CORE_R[0], CORE_R[1], a0, a1, "lbl core", true));
    const secSpan = coreSpan / Math.max(inner.length, 1);
    for (let i = 0; i < inner.length; i++) {
      const sa0 = a0 + i * secSpan;
      const sa1 = sa0 + secSpan;
      arcs.appendChild(mkArc(c.color, SEC_R[0], SEC_R[1], sa0, sa1, inner[i], store.teamArcByLabel));
      arcs.appendChild(mkLabel(inner[i], SEC_R[0], SEC_R[1], sa0, sa1, "lbl"));
    }
    const tertSpan = coreSpan / Math.max(outer.length, 1);
    for (let i = 0; i < outer.length; i++) {
      const ta0 = a0 + i * tertSpan;
      const ta1 = ta0 + tertSpan;
      arcs.appendChild(mkArc(c.color, TER_R[0], TER_R[1], ta0, ta1, outer[i], store.teamArcByLabel));
      arcs.appendChild(mkLabel(outer[i], TER_R[0], TER_R[1], ta0, ta1, "lbl"));
    }
  }
}

function renderTeamWheel() {
  // Union: a cell is lit if any agent's most recent report names it.
  // Intensity = max across agents, so a single very-strong agent still
  // shows the cell hot.
  const maxByLabel = new Map();
  for (const name in store.agents) {
    const r = store.agents[name];
    if (!r || !Array.isArray(r.feelings)) continue;
    for (const f of r.feelings) {
      const prev = maxByLabel.get(f.label) || 0;
      if (f.intensity > prev) maxByLabel.set(f.label, f.intensity);
    }
  }
  for (const [, el] of store.teamArcByLabel) {
    el.setAttribute("fill-opacity", 0.08);
    el.classList.remove("lit");
    const lbl = el.nextElementSibling;
    if (lbl && lbl.classList.contains("lbl")) lbl.classList.remove("lit");
  }
  for (const [label, intensity] of maxByLabel) {
    const el = store.teamArcByLabel.get(label);
    if (!el) continue;
    el.setAttribute("fill-opacity", 0.55 + 0.45 * intensity);
    el.classList.add("lit");
    const lbl = el.nextElementSibling;
    if (lbl && lbl.classList.contains("lbl")) lbl.classList.add("lit");
  }
}

const SENT_POS = getCSS("--c-peaceful") || "#5EE7A1";
const SENT_NEG = getCSS("--c-mad") || "#FF5C5C";
const SENT_NEUTRAL = getCSS("--text-3") || "#8892A6";

function sentimentTone(ratio) {
  if (ratio == null) return SENT_NEUTRAL;
  if (ratio >= 0.5) return SENT_POS;
  return SENT_NEG;
}

function renderSentimentReadout() {
  const sent = store.sentiment || { ratio: null, agentCount: 0 };
  const tone = sentimentTone(sent.ratio);
  const sentEl = $("sentiment");
  sentEl.style.setProperty("--tone", tone);
  const pctEl = $("sentiment-pct");
  if (sent.ratio == null) {
    pctEl.firstChild ? pctEl.replaceChildren() : null;
    pctEl.replaceChildren(document.createTextNode("— "));
    const sym = document.createElement("span"); sym.className = "sym"; sym.textContent = "%";
    pctEl.appendChild(sym);
  } else {
    const pct = Math.round(sent.ratio * 100);
    pctEl.replaceChildren(document.createTextNode(`${pct} `));
    const sym = document.createElement("span"); sym.className = "sym"; sym.textContent = "%";
    pctEl.appendChild(sym);
  }
  const cap = $("sentiment-caption");
  cap.replaceChildren();
  const lab = document.createElement("span"); lab.className = "lab";
  if (sent.ratio == null) lab.textContent = "no valenced feelings yet";
  else if (sent.ratio > 0.55) lab.textContent = "positive";
  else if (sent.ratio < 0.45) lab.textContent = "negative";
  else lab.textContent = "neutral";
  cap.appendChild(lab);
  if (sent.agentCount > 0) {
    const sep1 = document.createElement("span"); sep1.className = "sep"; sep1.textContent = "·";
    const agents = document.createTextNode(`${sent.agentCount} agent${sent.agentCount === 1 ? "" : "s"}`);
    cap.append(sep1, agents);
  }
  const last = store.history[store.history.length - 1];
  if (last) {
    const sep2 = document.createElement("span"); sep2.className = "sep"; sep2.textContent = "·";
    const age = document.createTextNode(ageLabel(last.ts));
    cap.append(sep2, age);
  }
}

// "Nice" tick step in ms covering the visible time range with ~4-5 ticks.
function pickTimeStep(rangeMs) {
  const steps = [
    60_000,         // 1m
    5 * 60_000,     // 5m
    10 * 60_000,    // 10m
    15 * 60_000,    // 15m
    30 * 60_000,    // 30m
    60 * 60_000,    // 1h
    3 * 60 * 60_000,   // 3h
    6 * 60 * 60_000,   // 6h
    12 * 60 * 60_000,  // 12h
    24 * 60 * 60_000,  // 1d
  ];
  const target = rangeMs / 4;
  for (const s of steps) if (s >= target) return s;
  return steps[steps.length - 1];
}

function fmtHHMM(ts) {
  const d = new Date(ts);
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return `${hh}:${mm}`;
}

function renderSentimentChart() {
  const svg = $("sentiment-chart");
  svg.replaceChildren();
  const W = 600, H = 160;
  const PAD = { left: 32, right: 12, top: 8, bottom: 30 };
  const plotW = W - PAD.left - PAD.right;
  const plotH = H - PAD.top - PAD.bottom;
  const midY = PAD.top + plotH * 0.5;
  const baseY = PAD.top + plotH; // y for 0%
  const topY  = PAD.top;         // y for 100%

  const NS = "http://www.w3.org/2000/svg";
  const points = store.history.filter(p => Number.isFinite(p.ts));

  // Y-axis labels (100, 50, 0)
  for (const [val, y] of [[100, topY], [50, midY], [0, baseY]]) {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", PAD.left - 6);
    t.setAttribute("y", y + 3);
    t.setAttribute("text-anchor", "end");
    t.setAttribute("class", "axis-lbl");
    t.textContent = `${val}`;
    svg.appendChild(t);
  }

  // Mid line at 50%
  const mid = document.createElementNS(NS, "line");
  mid.setAttribute("x1", PAD.left); mid.setAttribute("x2", W - PAD.right);
  mid.setAttribute("y1", midY); mid.setAttribute("y2", midY);
  mid.setAttribute("class", "mid-line");
  svg.appendChild(mid);

  if (points.length === 0) {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", (PAD.left + W - PAD.right) / 2);
    t.setAttribute("y", midY - 4);
    t.setAttribute("class", "empty-label");
    t.textContent = "awaiting reports";
    svg.appendChild(t);
    return;
  }

  // Time domain: first point → now (or last point + 30s tail, whichever larger).
  const t0 = points[0].ts;
  const t1 = Math.max(Date.now(), points[points.length - 1].ts + 30_000);
  const range = Math.max(t1 - t0, 60_000); // floor at 1min to avoid divide-by-zero
  const xOf = ts => PAD.left + ((ts - t0) / range) * plotW;
  const yOf = ratio => ratio == null ? midY : PAD.top + (1 - ratio) * plotH;

  // Time-axis ticks
  const step = pickTimeStep(range);
  const firstTick = Math.ceil(t0 / step) * step;
  for (let t = firstTick; t <= t1; t += step) {
    const x = xOf(t);
    const tick = document.createElementNS(NS, "line");
    tick.setAttribute("x1", x); tick.setAttribute("x2", x);
    tick.setAttribute("y1", baseY); tick.setAttribute("y2", baseY + 4);
    tick.setAttribute("class", "grid-line");
    svg.appendChild(tick);
    const lbl = document.createElementNS(NS, "text");
    lbl.setAttribute("x", x); lbl.setAttribute("y", baseY + 16);
    lbl.setAttribute("text-anchor", "middle");
    lbl.setAttribute("class", "axis-lbl");
    lbl.textContent = fmtHHMM(t);
    svg.appendChild(lbl);
  }

  // Baseline x-axis line
  const xaxis = document.createElementNS(NS, "line");
  xaxis.setAttribute("x1", PAD.left); xaxis.setAttribute("x2", W - PAD.right);
  xaxis.setAttribute("y1", baseY); xaxis.setAttribute("y2", baseY);
  xaxis.setAttribute("class", "grid-line");
  svg.appendChild(xaxis);

  // Trace points — drop nulls but show gaps
  const segs = [];
  let cur = [];
  for (const p of points) {
    if (p.ratio == null) {
      if (cur.length) segs.push(cur);
      cur = [];
    } else {
      cur.push(p);
    }
  }
  if (cur.length) segs.push(cur);

  for (const seg of segs) {
    if (seg.length === 0) continue;
    // Split into pos/neg areas relative to 0.5 baseline so each is shaded
    // in its polarity color.
    const posD = [];
    const negD = [];
    posD.push(`M ${xOf(seg[0].ts)} ${midY}`);
    negD.push(`M ${xOf(seg[0].ts)} ${midY}`);
    for (const p of seg) {
      const x = xOf(p.ts);
      const y = yOf(p.ratio);
      if (p.ratio >= 0.5) {
        posD.push(`L ${x} ${y}`);
        negD.push(`L ${x} ${midY}`);
      } else {
        posD.push(`L ${x} ${midY}`);
        negD.push(`L ${x} ${y}`);
      }
    }
    posD.push(`L ${xOf(seg[seg.length-1].ts)} ${midY} Z`);
    negD.push(`L ${xOf(seg[seg.length-1].ts)} ${midY} Z`);
    const posPath = document.createElementNS(NS, "path");
    posPath.setAttribute("d", posD.join(" ")); posPath.setAttribute("class", "area-pos");
    svg.appendChild(posPath);
    const negPath = document.createElementNS(NS, "path");
    negPath.setAttribute("d", negD.join(" ")); negPath.setAttribute("class", "area-neg");
    svg.appendChild(negPath);

    // Trace line
    const trace = document.createElementNS(NS, "polyline");
    trace.setAttribute("points", seg.map(p => `${xOf(p.ts)},${yOf(p.ratio)}`).join(" "));
    trace.setAttribute("class", "trace");
    svg.appendChild(trace);
  }

  // Last-point dot in the dynamic tone
  const lastValid = [...points].reverse().find(p => p.ratio != null);
  if (lastValid) {
    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("cx", xOf(lastValid.ts));
    dot.setAttribute("cy", yOf(lastValid.ratio));
    dot.setAttribute("r", 3.5);
    dot.setAttribute("class", "dot");
    svg.appendChild(dot);
  }

  // Join / leave markers — triangles on the x-axis line where agentCount
  // changed. First point with count > 0 also counts as a join.
  let prevCount = 0;
  for (let i = 0; i < points.length; i++) {
    const c = Number(points[i].agentCount) || 0;
    if (c === prevCount) continue;
    const x = xOf(points[i].ts);
    const joined = c > prevCount;
    const tri = document.createElementNS(NS, "polygon");
    if (joined) {
      // upward triangle, on x-axis, peak above
      tri.setAttribute("points", `${x-3},${baseY+1} ${x+3},${baseY+1} ${x},${baseY-5}`);
      tri.setAttribute("fill", SENT_POS);
    } else {
      // downward triangle, peak below
      tri.setAttribute("points", `${x-3},${baseY-1} ${x+3},${baseY-1} ${x},${baseY+5}`);
      tri.setAttribute("fill", SENT_NEG);
    }
    tri.setAttribute("fill-opacity", "0.85");
    const title = document.createElementNS(NS, "title");
    const delta = c - prevCount;
    title.textContent = `${joined ? "joined" : "left"} (${delta > 0 ? "+" : ""}${delta}, now ${c}) at ${fmtHHMM(points[i].ts)}`;
    tri.appendChild(title);
    svg.appendChild(tri);
    prevCount = c;
  }
}

function coreForLabel(label) {
  if (!label) return null;
  for (const c of store.feelings.cores) {
    if (c.label === label) return c;
    const subs = c.subs || [];
    for (const sub of subs) if (sub === label) return c;
  }
  return null;
}

function tickAge() {
  if (!store.active) return;
  const r = store.agents[store.active];
  if (!r) return;
  $("m-age").textContent = ageLabel(r.ts);
}

function ageLabel(ts) {
  const ageSec = Math.max(0, Math.round((Date.now() - ts) / 1000));
  return ageSec < 60 ? `${ageSec}s ago`
    : ageSec < 3600 ? `${Math.round(ageSec/60)}m ago`
    : `${Math.round(ageSec/3600)}h ago`;
}

init();
</script>
</body>
</html>
